name: LearnKeyboard
options:
  bundleIdPrefix: com.learnkeyboard
  postGenCommand: python3 scripts/fix_capabilities.py
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    REGISTER_APP_GROUPS: YES
    MARKETING_VERSION: '1.0.5'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CURRENT_PROJECT_VERSION: '19'
    APP_GROUP_IDENTIFIER: group.com.example.typetolearn.shared
packages:
  KeyboardCore:
    path: .
targets:
  LearnKeyboard:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - App
      - Shared
      - path: Resources
        excludes: [RimeData, lexicon.sqlite, lexicon-manifest.json]
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typetolearn
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 伴语输入法
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: 伴语输入法
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, zh-Hans, zh-Hant]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.typetolearn
            CFBundleURLSchemes: [typetolearn]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LearnKeyboardAppGroup: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
    dependencies:
      - target: LearnKeyboardExtension
        embed: true
      - package: KeyboardCore
        product: KeyboardCore
  LearnKeyboardExtension:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - KeyboardExtension
      - Shared
      - path: Resources
        excludes: [RimeData, lexicon.sqlite, lexicon-manifest.json]
        buildPhase: resources
    postBuildScripts:
      - name: Stage iPhone lexicon
        script: /bin/sh "$SRCROOT/scripts/stage_ios_lexicon.sh"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typetolearn.keyboard
        TARGETED_DEVICE_FAMILY: '1'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Config/Keyboard-Info.plist
      properties:
        CFBundleDisplayName: 伴语输入法
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LearnKeyboardAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            RequestsOpenAccess: true
    entitlements:
      path: Config/Keyboard.entitlements
      properties:
        com.apple.security.application-groups: ["$(APP_GROUP_IDENTIFIER)"]
    dependencies:
      - package: KeyboardCore
        product: KeyboardCore
  KeyboardDeviceTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DeviceTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typetolearn.devicetests
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LearnKeyboard
    dependencies:
      - target: LearnKeyboard
  LearnKeyboardMac:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - Mac/App
      - Mac/Shared
      - Shared/TranslationService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.typetolearn
        PRODUCT_NAME: TypeToLearnMac
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ''
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 伴语输入法
    dependencies:
      - package: KeyboardCore
        product: DesktopCore
      - target: LearnKeyboardMacInputMethod
        link: false
        embed: false
    postBuildScripts:
      - name: Embed Mac input method
        script: |
          set -eu
          input_methods="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/InputMethods"
          component="$input_methods/TypeToLearnInputMethod.app"
          mkdir -p "$input_methods"
          # Replace the signed bundle so incremental builds cannot retain obsolete resources.
          rm -rf "$component"
          ditto "$BUILT_PRODUCTS_DIR/TypeToLearnInputMethod.app" "$component"
        basedOnDependencyAnalysis: false
  LearnKeyboardMacInputMethod:
    type: application
    platform: macOS
    deploymentTarget: '26.0'
    sources:
      - Mac/InputMethod
      - Mac/Shared
      - Shared/TranslationService.swift
      - path: Resources/emoji-catalog.json
        buildPhase: resources
      - path: Mac/DictionaryResources
        optional: true
        type: folder
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      - path: Resources/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnkeyboard.inputmethod.mac.debug
        PRODUCT_NAME: TypeToLearnInputMethod
        SWIFT_VERSION: '5.0'
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: '-'
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ''
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
    info:
      path: Config/MacInputMethod-Info.plist
      properties:
        CFBundleName: 伴语
        CFBundleDisplayName: 伴语
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSBackgroundOnly: true
        InputMethodConnectionName: $(PRODUCT_BUNDLE_IDENTIFIER)_Connection
        InputMethodServerControllerClass: TypeToLearnInputController
        tsInputMethodCharacterRepertoireKey: [Hans, Hant, Latn]
        TISInputSourceID: com.learnkeyboard.inputmethod.mac.debug
        TISIntendedLanguage: zh-Hans
        ComponentInputModeDict:
          tsInputModeListKey:
            com.learnkeyboard.inputmethod.mac.debug.pinyin:
              TISInputSourceID: com.learnkeyboard.inputmethod.mac.debug.pinyin
              TISIntendedLanguage: zh-Hans
              tsInputModeIsVisibleKey: true
              tsInputModeScriptKey: smUnicodeScript
              tsInputModePrimaryInScriptKey: true
              tsInputModeDefaultStateKey: true
              tsInputModeMenuItemName: 伴语
    dependencies:
      - package: KeyboardCore
        product: DesktopCore
schemes:
  LearnKeyboard:
    build:
      targets:
        LearnKeyboard: all
        LearnKeyboardExtension: all
    run:
      config: Debug
    test:
      targets: [KeyboardDeviceTests]
  LearnKeyboardMac:
    build:
      targets:
        LearnKeyboardMac: all
        LearnKeyboardMacInputMethod: all
    run:
      config: Debug
    archive:
      config: Release
